<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep ink background -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1D2B"/>
      <stop offset="100%" stop-color="#0F1220"/>
    </linearGradient>

    <!-- Warm accent glow -->
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1D7C6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A18E6E" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Subtle line shimmer -->
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9F7F4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F9F7F4" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background: Square with elegant rounding -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)"/>

  <!-- The "System" - Concentric Motion -->
  <!-- Outer Orbit (Partial) -->
  <path
    d="M48 32 A16 16 0 1 1 32 16"
    fill="none"
    stroke="url(#line-grad)"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-dasharray="0.5 4"
  />

  <!-- Inner Motion Arc -->
  <path
    d="M20 32 A12 12 0 0 1 32 20"
    fill="none"
    stroke="#F9F7F4"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Primary Node (Current State) -->
  <circle cx="32" cy="32" r="4.5" fill="#F9F7F4"/>
  <circle cx="32" cy="32" r="6" fill="url(#node-glow)" opacity="0.4"/>

  <!-- Secondary Node (In Motion) -->
  <circle cx="48" cy="32" r="2.5" fill="#A18E6E"/>

  <!-- Crosshair Accents (Systems Precision) -->
  <line x1="32" y1="8" x2="32" y2="12" stroke="#F9F7F4" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="32" y1="52" x2="32" y2="56" stroke="#F9F7F4" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="8" y1="32" x2="12" y2="32" stroke="#F9F7F4" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="52" y1="32" x2="56" y2="32" stroke="#F9F7F4" stroke-opacity="0.2" stroke-width="1"/>

</svg>
